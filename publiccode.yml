description:
  en:
    shortDescription: "VALO receipt layer — attest observations without interpreting."
    longDescription: >
      Veritas is the LA6 receipt layer of the VALO governance stack. It records
      and attests observation packages and follow-on receipts into an
      append-only, tamper-evident WORM ledger with canonical SHA-256 digests.
      Veritas never analyses, classifies, concludes or authorizes.
