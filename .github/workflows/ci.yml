name: Veritas CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'hermes/veritas-worm-integrity-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: hermes/veritas-worm-integrity-20260806

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Apply safe Ruff fixes
        run: |
          python -m ruff check --fix --exit-zero src tests
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "fix: apply safe Veritas lint repairs"
            git push origin HEAD:hermes/veritas-worm-integrity-20260806
          fi

  test:
    needs: repair
    if: always() && (needs.repair.result == 'success' || needs.repair.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: python -m ruff check --output-format=github src tests

      - name: Type check
        run: python -m mypy src/veritas

      - name: Test
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
